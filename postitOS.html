<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Capture Rapide</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f4f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .popup-container {
            background: white;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 500px;
        }
        textarea {
            width: 100%;
            height: 120px;
            padding: 12px;
            border: 1px solid #d4d4d8;
            border-radius: 8px;
            font-size: 16px;
            resize: none;
            box-sizing: border-box;
            outline: none;
        }
        textarea:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }
        button {
            margin-top: 12px;
            width: 100%;
            padding: 12px;
            background-color: #18181b;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            font-weight: 600;
        }
        button:hover {
            background-color: #27272a;
        }
        #status {
            margin-top: 12px;
            font-size: 14px;
            color: #10b981;
            text-align: center;
            display: none;
        }
    </style>
</head>
<body>

<div class="popup-container">
    <textarea id="noteInput" placeholder="Note une idée, une tâche, un verbatim..." autofocus></textarea>
    <button onclick="sendNote()" id="sendBtn">Envoyer</button>
    <!-- Message de confirmation selon tes spécifications -->
    <div id="status">Noté. Classification en cours.</div>
</div>

<script>
    const webhookUrl = "https://hook.eu2.make.com/3k0lnke3j2x2u7xtdoil82ejkvbvhv6q";

    // Permet d'envoyer avec Cmd+Enter ou Ctrl+Enter
    document.getElementById("noteInput").addEventListener("keydown", function(e) {
        if ((e.metaKey || e.ctrlKey) && e.key === "Enter") {
            sendNote();
        }
    });

    async function sendNote() {
        const inputField = document.getElementById("noteInput");
        const statusText = document.getElementById("status");
        const sendBtn = document.getElementById("sendBtn");
        const note = inputField.value.trim();

        if (!note) return;

        // UI Feedback
        sendBtn.textContent = "Envoi...";
        sendBtn.disabled = true;

        try {
            const response = await fetch(webhookUrl, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({ note: note, source: "popup_web" })
            });

            if (response.ok) {
                // Succès : on affiche le message de confirmation court
                inputField.value = "";
                statusText.style.display = "block";
                setTimeout(() => { statusText.style.display = "none"; }, 3000);
            } else {
                alert("Erreur lors de l'envoi à Make.");
            }
        } catch (error) {
            console.error("Erreur:", error);
            alert("Impossible de joindre le webhook.");
        } finally {
            sendBtn.textContent = "Envoyer";
            sendBtn.disabled = false;
            inputField.focus();
        }
    }
</script>

</body>
</html>
