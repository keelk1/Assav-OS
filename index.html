<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Assav OS</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Supabase JS SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              500: '#3b82f6',
            }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen font-sans antialiased selection:bg-zinc-800">

  <!-- Configuration Supabase -->
  <script>
    const SUPABASE_URL = 'https://wmsebrsgsikheksadokw.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Indtc2VicnNnc2lraGVrc2Fkb2t3Iiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc4OTkwMDY5NiwiZXhwIjoyMTA1NDc2Njk2fQ.gyn9eYFAAbErggy8jqrI4-G1ysvp3AtXnUHP5wBYI1M';

    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  </script>

  <!-- En-tête / Navigation -->
  <header class="border-b border-zinc-800/80 sticky top-0 bg-zinc-950/80 backdrop-blur-md z-10">
    <div class="max-w-4xl mx-auto px-4 h-16 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-8 h-8 rounded-lg bg-zinc-900 border border-zinc-700 flex items-center justify-center font-bold text-xs tracking-wider text-zinc-200">
          AS
        </div>
        <span class="font-semibold text-zinc-100 tracking-tight text-sm sm:text-base">assav-os</span>
      </div>

      <!-- Onglets Tâches / Idées / Inbox -->
      <div class="flex bg-zinc-900 border border-zinc-800 rounded-xl p-1 text-xs sm:text-sm font-medium gap-1">
        <button id="tab-tasks" onclick="switchTab('tasks')" class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-zinc-800 text-white shadow-sm transition-all">
          <i data-lucide="check-square" class="w-4 h-4"></i>
          <span>Tâches</span>
          <span id="tasks-count" class="bg-zinc-700/60 text-zinc-300 text-[10px] px-1.5 py-0.2 rounded-full">0</span>
        </button>
        <button id="tab-ideas" onclick="switchTab('ideas')" class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-zinc-400 hover:text-zinc-200 transition-all">
          <i data-lucide="lightbulb" class="w-4 h-4"></i>
          <span>Idées</span>
          <span id="ideas-count" class="bg-zinc-700/60 text-zinc-300 text-[10px] px-1.5 py-0.2 rounded-full">0</span>
        </button>
        <button id="tab-inbox" onclick="switchTab('inbox')" class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-zinc-400 hover:text-zinc-200 transition-all">
          <i data-lucide="inbox" class="w-4 h-4"></i>
          <span>Inbox</span>
          <span id="inbox-count" class="bg-zinc-700/60 text-zinc-300 text-[10px] px-1.5 py-0.2 rounded-full">0</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Contenu Principal -->
  <main class="max-w-4xl mx-auto px-4 py-8">
    <div id="loading" class="text-center py-24 text-zinc-500 text-sm animate-pulse">
      Connexion à ta base Supabase...
    </div>

    <!-- Section TÂCHES -->
    <div id="tasks-section" class="space-y-3 hidden">
      <div id="tasks-list" class="space-y-3"></div>
    </div>

    <!-- Section IDÉES -->
    <div id="ideas-section" class="grid grid-cols-1 md:grid-cols-2 gap-4 hidden">
      <div id="ideas-list" class="contents"></div>
    </div>

    <!-- Section INBOX -->
    <div id="inbox-section" class="space-y-4 hidden">
      <div id="inbox-list" class="space-y-4"></div>
    </div>
  </main>

  <script>
    let currentTab = 'tasks';
    let tasks = [];
    let ideas = [];
    let inboxItems = [];

    async function loadData() {
      document.getElementById('loading').classList.remove('hidden');

      // 1. Récupérer les tâches
      const { data: tasksData } = await supabaseClient
        .from('tasks')
        .select('*')
        .order('created_at', { ascending: false });

      // 2. Récupérer les idées
      const { data: ideasData } = await supabaseClient
        .from('ideas')
        .select('*')
        .order('created_at', { ascending: false });

      // 3. Récupérer l'inbox
      const { data: inboxData } = await supabaseClient
        .from('inbox')
        .select('*')
        .order('created_at', { ascending: false });

      document.getElementById('loading').classList.add('hidden');

      if (tasksData) {
        tasks = tasksData;
        renderTasks();
      }
      if (ideasData) {
        ideas = ideasData;
        renderIdeas();
      }
      if (inboxData) {
        inboxItems = inboxData;
        renderInbox();
      }
      lucide.createIcons();
    }

    function switchTab(tab) {
      currentTab = tab;
      const tabs = ['tasks', 'ideas', 'inbox'];

      tabs.forEach(t => {
        const btn = document.getElementById(`tab-${t}`);
        const sec = document.getElementById(`${t}-section`);
        if (t === tab) {
          btn.className = 'flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-zinc-800 text-white shadow-sm transition-all';
          sec.classList.remove('hidden');
        } else {
          btn.className = 'flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-zinc-400 hover:text-zinc-200 transition-all';
          sec.classList.add('hidden');
        }
      });

      lucide.createIcons();
    }

    // --- RENDU DES TÂCHES ---
    function renderTasks() {
      const list = document.getElementById('tasks-list');
      const pendingCount = tasks.filter(t => t.status !== 'done').length;
      document.getElementById('tasks-count').innerText = pendingCount;

      if (tasks.length === 0) {
        list.innerHTML = `<div class="text-center py-20 text-zinc-500 border border-dashed border-zinc-800 rounded-2xl text-sm">Aucune tâche enregistrée.</div>`;
        return;
      }

      list.innerHTML = tasks.map(task => {
        const isDone = task.status === 'done';
        const dueDate = task.due_date ? task.due_date.substring(0, 10) : '';
        return `
          <div class="flex flex-col sm:flex-row sm:items-center justify-between p-4 rounded-xl border transition-all ${
            isDone ? 'bg-zinc-950 border-zinc-900 opacity-50' : 'bg-zinc-900/40 border-zinc-800/80 hover:border-zinc-700'
          }">
            <div class="flex items-start gap-3 flex-1">
              <button onclick="toggleTask('${task.id}', '${task.status}')" class="mt-0.5 text-zinc-400 hover:text-emerald-400 transition-colors">
                <i data-lucide="${isDone ? 'check-circle-2' : 'circle'}" class="w-5 h-5 ${isDone ? 'text-emerald-500' : ''}"></i>
              </button>
              <div>
                <p class="text-sm font-medium ${isDone ? 'line-through text-zinc-500' : 'text-zinc-200'}">
                  ${task.title}
                </p>
                ${task.description ? `<p class="text-xs text-zinc-400 mt-1 leading-relaxed">${task.description}</p>` : ''}
              </div>
            </div>
            <div class="flex items-center gap-2 mt-3 sm:mt-0 pt-2 sm:pt-0 border-t sm:border-t-0 border-zinc-800/50">
              <i data-lucide="calendar" class="w-3.5 h-3.5 text-zinc-500"></i>
              <input type="date" value="${dueDate}" onchange="updateDueDate('${task.id}', this.value)"
                class="bg-zinc-950 border border-zinc-800 text-zinc-400 text-xs rounded-lg px-2 py-1 outline-none focus:border-zinc-600 transition-colors cursor-pointer" />
            </div>
          </div>
        `;
      }).join('');
      lucide.createIcons();
    }

    // --- RENDU DES IDÉES ---
    function renderIdeas() {
      const list = document.getElementById('ideas-list');
      document.getElementById('ideas-count').innerText = ideas.length;

      if (ideas.length === 0) {
        list.innerHTML = `<div class="col-span-2 text-center py-20 text-zinc-500 border border-dashed border-zinc-800 rounded-2xl text-sm">Aucune idée capturée.</div>`;
        return;
      }

      list.innerHTML = ideas.map(idea => {
        const dateStr = new Date(idea.created_at).toLocaleDateString('fr-FR');
        const tagsHtml = (idea.tags && Array.isArray(idea.tags)) 
          ? idea.tags.map(t => `<span class="bg-zinc-800 text-zinc-300 text-[10px] px-2 py-0.5 rounded">#${t}</span>`).join(' ') 
          : '';

        return `
          <div class="bg-zinc-900/40 border border-zinc-800/80 hover:border-zinc-700 rounded-2xl p-5 flex flex-col justify-between transition-all">
            <div>
              <div class="flex items-center justify-between mb-3">
                <span class="flex items-center gap-1.5 text-xs font-semibold px-2.5 py-1 rounded-full bg-amber-500/10 text-amber-400 border border-amber-500/20">
                  <i data-lucide="sparkles" class="w-3 h-3"></i>
                  Idée
                </span>
                <select onchange="updateIdeaStatus('${idea.id}', this.value)" class="bg-zinc-950 border border-zinc-800 text-zinc-400 text-xs rounded-lg px-2 py-1 outline-none focus:border-zinc-600 cursor-pointer">
                  <option value="capturée" ${idea.status === 'capturée' ? 'selected' : ''}>Capturée</option>
                  <option value="à qualifier" ${idea.status === 'à qualifier' ? 'selected' : ''}>À qualifier</option>
                  <option value="en cours" ${idea.status === 'en cours' ? 'selected' : ''}>En cours</option>
                  <option value="validée" ${idea.status === 'validée' ? 'selected' : ''}>Validée</option>
                  <option value="abandonnée" ${idea.status === 'abandonnée' ? 'selected' : ''}>Abandonnée</option>
                </select>
              </div>
              <h3 class="font-semibold text-zinc-200 text-base mb-2">${idea.title}</h3>
              <p class="text-xs text-zinc-400 leading-relaxed">${idea.summary || ''}</p>
            </div>
            <div class="mt-4 pt-3 border-t border-zinc-800/60 flex items-center justify-between text-xs text-zinc-500">
              <span class="flex items-center gap-1">
                <i data-lucide="clock" class="w-3 h-3"></i>
                ${dateStr}
              </span>
              <div class="flex gap-1">${tagsHtml}</div>
            </div>
          </div>
        `;
      }).join('');
      lucide.createIcons();
    }

    // --- RENDU DE L'INBOX ---
    function renderInbox() {
      const list = document.getElementById('inbox-list');
      document.getElementById('inbox-count').innerText = inboxItems.length;

      if (inboxItems.length === 0) {
        list.innerHTML = `<div class="text-center py-20 text-zinc-500 border border-dashed border-zinc-800 rounded-2xl text-sm">Inbox vide. Toutes les captures ont été traitées !</div>`;
        return;
      }

      list.innerHTML = inboxItems.map(item => {
        const dateStr = new Date(item.created_at).toLocaleString('fr-FR', {
          day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit'
        });

        // Couleur selon l'entité
        let badgeColor = 'bg-zinc-800 text-zinc-300 border-zinc-700';
        if (item.entity_type === 'task') badgeColor = 'bg-emerald-500/10 text-emerald-400 border-emerald-500/20';
        if (item.entity_type === 'idea') badgeColor = 'bg-amber-500/10 text-amber-400 border-amber-500/20';
        if (item.entity_type === 'conversation') badgeColor = 'bg-purple-500/10 text-purple-400 border-purple-500/20';

        return `
          <div class="bg-zinc-900/40 border border-zinc-800/80 hover:border-zinc-700 rounded-2xl p-5 space-y-3 transition-all">
            <div class="flex flex-wrap items-center justify-between gap-2">
              <div class="flex items-center gap-2">
                <!-- Sélecteur d'entité -->
                <select onchange="updateInboxEntityType('${item.id}', this.value)" class="border text-xs rounded-lg px-2 py-1 outline-none cursor-pointer ${badgeColor}">
                  <option value="task" ${item.entity_type === 'task' ? 'selected' : ''}>Task</option>
                  <option value="idea" ${item.entity_type === 'idea' ? 'selected' : ''}>Idea</option>
                  <option value="note" ${item.entity_type === 'note' ? 'selected' : ''}>Note</option>
                  <option value="conversation" ${item.entity_type === 'conversation' ? 'selected' : ''}>Conversation</option>
                  <option value="skill" ${item.entity_type === 'skill' ? 'selected' : ''}>Skill</option>
                </select>

                <span class="text-xs text-zinc-500 flex items-center gap-1">
                  <i data-lucide="clock" class="w-3 h-3"></i>
                  ${dateStr}
                </span>
              </div>

              <div class="flex items-center gap-2">
                <!-- Sélecteur de statut inbox -->
                <select onchange="updateInboxStatus('${item.id}', this.value)" class="bg-zinc-950 border border-zinc-800 text-zinc-400 text-xs rounded-lg px-2 py-1 outline-none focus:border-zinc-600 cursor-pointer">
                  <option value="processed" ${item.status === 'processed' ? 'selected' : ''}>Traité</option>
                  <option value="pending" ${item.status === 'pending' ? 'selected' : ''}>En attente</option>
                  <option value="archived" ${item.status === 'archived' ? 'selected' : ''}>Archivé</option>
                </select>

                <!-- Bouton supprimer -->
                <button onclick="deleteInboxItem('${item.id}')" title="Supprimer la note" class="text-zinc-500 hover:text-red-400 p-1 transition-colors">
                  <i data-lucide="trash-2" class="w-4 h-4"></i>
                </button>
              </div>
            </div>

            <!-- Note brute modifiable -->
            <div>
              <label class="block text-[10px] uppercase font-semibold text-zinc-500 mb-1">Note brute capturée (modifiable)</label>
              <textarea onchange="updateInboxRawNote('${item.id}', this.value)" rows="2" class="w-full bg-zinc-950 border border-zinc-800/80 rounded-xl p-3 text-sm text-zinc-200 outline-none focus:border-zinc-600 transition-colors leading-relaxed">${item.raw_note || ''}</textarea>
            </div>

            <!-- Analyse IA -->
            ${item.reason ? `
              <div class="text-xs text-zinc-400 bg-zinc-950/40 p-2.5 rounded-lg border border-zinc-800/50 flex items-start gap-2">
                <span class="text-zinc-500">🤖</span>
                <span><span class="text-zinc-500 font-medium">Raisonnement IA :</span> ${item.reason}</span>
              </div>
            ` : ''}
          </div>
        `;
      }).join('');
      lucide.createIcons();
    }

    // --- ACTIONS TÂCHES ---
    async function toggleTask(id, currentStatus) {
      const nextStatus = currentStatus === 'done' ? 'inbox' : 'done';
      await supabaseClient.from('tasks').update({ status: nextStatus }).eq('id', id);
      const t = tasks.find(item => item.id === id);
      if (t) t.status = nextStatus;
      renderTasks();
    }

    async function updateDueDate(id, dateVal) {
      await supabaseClient.from('tasks').update({ due_date: dateVal || null }).eq('id', id);
      const t = tasks.find(item => item.id === id);
      if (t) t.due_date = dateVal;
    }

    // --- ACTIONS IDÉES ---
    async function updateIdeaStatus(id, newStatus) {
      await supabaseClient.from('ideas').update({ status: newStatus }).eq('id', id);
      const i = ideas.find(item => item.id === id);
      if (i) i.status = newStatus;
    }

    // --- ACTIONS INBOX ---
    async function updateInboxRawNote(id, newText) {
      await supabaseClient.from('inbox').update({ raw_note: newText }).eq('id', id);
      const item = inboxItems.find(i => i.id === id);
      if (item) item.raw_note = newText;
    }

    async function updateInboxStatus(id, newStatus) {
      await supabaseClient.from('inbox').update({ status: newStatus }).eq('id', id);
      const item = inboxItems.find(i => i.id === id);
      if (item) item.status = newStatus;
    }

    async function updateInboxEntityType(id, newType) {
      await supabaseClient.from('inbox').update({ entity_type: newType }).eq('id', id);
      const item = inboxItems.find(i => i.id === id);
      if (item) item.entity_type = newType;
      renderInbox();
    }

    async function deleteInboxItem(id) {
      if (!confirm('Supprimer cette entrée de l’inbox ?')) return;
      await supabaseClient.from('inbox').delete().eq('id', id);
      inboxItems = inboxItems.filter(i => i.id !== id);
      renderInbox();
    }

    // Lancement au démarrage
    window.addEventListener('DOMContentLoaded', () => {
      switchTab('tasks');
      loadData();
    });
  </script>
</body>
</html>
