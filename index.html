<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Assav OS</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Supabase JS SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: { 500: '#3b82f6' }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen font-sans antialiased selection:bg-zinc-800 pb-20">

  <!-- Configuration Supabase -->
  <script>
    const SUPABASE_URL = 'https://wmsebrsgsikheksadokw.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Indtc2VicnNnc2lraGVrc2Fkb2t3Iiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc4OTkwMDY5NiwiZXhwIjoyMTA1NDc2Njk2fQ.gyn9eYFAAbErggy8jqrI4-G1ysvp3AtXnUHP5wBYI1M';

    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  </script>

  <!-- En-tête / Navigation -->
  <header class="border-b border-zinc-800/80 sticky top-0 bg-zinc-950/80 backdrop-blur-md z-20">
    <div class="max-w-4xl mx-auto px-4 h-16 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-8 h-8 rounded-lg bg-zinc-900 border border-zinc-700 flex items-center justify-center font-bold text-xs tracking-wider text-zinc-200">
          AS
        </div>
        <span class="font-semibold text-zinc-100 tracking-tight text-sm sm:text-base">assav-os</span>
      </div>

      <!-- Onglets Tâches / Idées / Inbox -->
      <div class="flex bg-zinc-900 border border-zinc-800 rounded-xl p-1 text-xs sm:text-sm font-medium gap-1">
        <button id="tab-tasks" onclick="switchTab('tasks')" class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-zinc-800 text-white shadow-sm transition-all">
          <i data-lucide="check-square" class="w-4 h-4"></i>
          <span>Tâches</span>
          <span id="tasks-count" class="bg-zinc-700/60 text-zinc-300 text-[10px] px-1.5 py-0.2 rounded-full">0</span>
        </button>
        <button id="tab-ideas" onclick="switchTab('ideas')" class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-zinc-400 hover:text-zinc-200 transition-all">
          <i data-lucide="lightbulb" class="w-4 h-4"></i>
          <span>Idées</span>
          <span id="ideas-count" class="bg-zinc-700/60 text-zinc-300 text-[10px] px-1.5 py-0.2 rounded-full">0</span>
        </button>
        <button id="tab-inbox" onclick="switchTab('inbox')" class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-zinc-400 hover:text-zinc-200 transition-all">
          <i data-lucide="inbox" class="w-4 h-4"></i>
          <span>Inbox</span>
          <span id="inbox-count" class="bg-zinc-700/60 text-zinc-300 text-[10px] px-1.5 py-0.2 rounded-full">0</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Notification Toast -->
  <div id="toast" class="fixed bottom-6 right-6 bg-zinc-800/90 backdrop-blur-md border border-zinc-700 text-zinc-200 text-xs px-3.5 py-2 rounded-xl shadow-2xl opacity-0 transition-opacity duration-200 pointer-events-none flex items-center gap-2 z-50">
    <i data-lucide="check" class="w-3.5 h-3.5 text-emerald-400"></i>
    <span id="toast-text">Modifié dans Supabase</span>
  </div>

  <!-- Contenu Principal -->
  <main class="max-w-4xl mx-auto px-4 py-8">
    <div id="loading" class="text-center py-24 text-zinc-500 text-sm animate-pulse">
      Connexion à ta base Supabase...
    </div>

    <!-- Section TÂCHES -->
    <div id="tasks-section" class="space-y-4 hidden">
      <!-- Formulaire Ajout Tâche -->
      <form onsubmit="createTask(event)" class="flex gap-2">
        <input id="new-task-title" type="text" placeholder="+ Ajouter une tâche directe (Entrée pour créer)..." 
          class="flex-1 bg-zinc-900/60 border border-zinc-800 rounded-xl px-4 py-2.5 text-sm text-zinc-200 placeholder:text-zinc-600 outline-none focus:border-zinc-600 transition-colors" />
        <button type="submit" class="bg-zinc-800 hover:bg-zinc-700 text-zinc-200 text-xs font-medium px-4 py-2.5 rounded-xl border border-zinc-700 transition-colors">
          Ajouter
        </button>
      </form>
      <div id="tasks-list" class="space-y-3"></div>
    </div>

    <!-- Section IDÉES -->
    <div id="ideas-section" class="space-y-4 hidden">
      <!-- Formulaire Ajout Idée -->
      <form onsubmit="createIdea(event)" class="bg-zinc-900/40 border border-zinc-800/80 rounded-2xl p-4 space-y-2.5">
        <input id="new-idea-title" type="text" placeholder="Titre de la nouvelle idée..." required
          class="w-full bg-zinc-950 border border-zinc-800/80 rounded-xl px-3 py-2 text-sm text-zinc-200 placeholder:text-zinc-600 outline-none focus:border-zinc-600" />
        <textarea id="new-idea-summary" rows="2" placeholder="Résumé factuel ou problème ciblé..."
          class="w-full bg-zinc-950 border border-zinc-800/80 rounded-xl px-3 py-2 text-xs text-zinc-300 placeholder:text-zinc-600 outline-none focus:border-zinc-600"></textarea>
        <div class="flex justify-end">
          <button type="submit" class="bg-zinc-800 hover:bg-zinc-700 text-zinc-200 text-xs font-medium px-4 py-2 rounded-xl border border-zinc-700 transition-colors">
            Créer l'idée
          </button>
        </div>
      </form>
      <div id="ideas-list" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
    </div>

    <!-- Section INBOX -->
    <div id="inbox-section" class="space-y-4 hidden">
      <div id="inbox-list" class="space-y-4"></div>
    </div>
  </main>

  <script>
    let currentTab = 'tasks';
    let tasks = [];
    let ideas = [];
    let inboxItems = [];

    // Notification toast
    function notify(text = 'Modifié dans Supabase') {
      const toast = document.getElementById('toast');
      document.getElementById('toast-text').innerText = text;
      toast.classList.remove('opacity-0');
      setTimeout(() => toast.classList.add('opacity-0'), 2000);
    }

    async function loadData() {
      document.getElementById('loading').classList.remove('hidden');

      const [{ data: tasksData }, { data: ideasData }, { data: inboxData }] = await Promise.all([
        supabaseClient.from('tasks').select('*').order('created_at', { ascending: false }),
        supabaseClient.from('ideas').select('*').order('created_at', { ascending: false }),
        supabaseClient.from('inbox').select('*').order('created_at', { ascending: false })
      ]);

      document.getElementById('loading').classList.add('hidden');

      if (tasksData) tasks = tasksData;
      if (ideasData) ideas = ideasData;
      if (inboxData) inboxItems = inboxData;

      renderTasks();
      renderIdeas();
      renderInbox();
      lucide.createIcons();
    }

    function switchTab(tab) {
      currentTab = tab;
      const tabs = ['tasks', 'ideas', 'inbox'];

      tabs.forEach(t => {
        const btn = document.getElementById(`tab-${t}`);
        const sec = document.getElementById(`${t}-section`);
        if (t === tab) {
          btn.className = 'flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-zinc-800 text-white shadow-sm transition-all';
          sec.classList.remove('hidden');
        } else {
          btn.className = 'flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-zinc-400 hover:text-zinc-200 transition-all';
          sec.classList.add('hidden');
        }
      });

      lucide.createIcons();
    }

    // ==========================================
    // TÂCHES
    // ==========================================
    function renderTasks() {
      const list = document.getElementById('tasks-list');
      const pendingCount = tasks.filter(t => t.status !== 'done').length;
      document.getElementById('tasks-count').innerText = pendingCount;

      if (tasks.length === 0) {
        list.innerHTML = `<div class="text-center py-16 text-zinc-500 border border-dashed border-zinc-800 rounded-2xl text-sm">Aucune tâche enregistrée.</div>`;
        return;
      }

      list.innerHTML = tasks.map(task => {
        const isDone = task.status === 'done';
        const dueDate = task.due_date ? task.due_date.substring(0, 10) : '';

        return `
          <div class="flex flex-col sm:flex-row sm:items-center justify-between p-4 rounded-xl border gap-3 transition-all ${
            isDone ? 'bg-zinc-950 border-zinc-900 opacity-60' : 'bg-zinc-900/40 border-zinc-800/80 hover:border-zinc-700'
          }">
            <div class="flex items-start gap-3 flex-1 min-w-0">
              <button onclick="toggleTask('${task.id}', '${task.status}')" class="mt-1 text-zinc-400 hover:text-emerald-400 transition-colors flex-shrink-0">
                <i data-lucide="${isDone ? 'check-circle-2' : 'circle'}" class="w-5 h-5 ${isDone ? 'text-emerald-500' : ''}"></i>
              </button>
              
              <div class="flex-1 min-w-0 space-y-1">
                <!-- Titre modifiable en direct -->
                <input type="text" value="${escapeHtml(task.title || '')}" 
                  onchange="updateTaskField('${task.id}', 'title', this.value)"
                  class="w-full bg-transparent font-medium text-sm outline-none border-b border-transparent focus:border-zinc-600 transition-colors ${
                    isDone ? 'line-through text-zinc-500' : 'text-zinc-200'
                  }" />

                <!-- Description modifiable -->
                <input type="text" value="${escapeHtml(task.description || '')}" placeholder="Ajouter une description..."
                  onchange="updateTaskField('${task.id}', 'description', this.value)"
                  class="w-full bg-transparent text-xs text-zinc-500 placeholder:text-zinc-700 outline-none border-b border-transparent focus:border-zinc-600 transition-colors" />
              </div>
            </div>

            <!-- Échéance & Suppression -->
            <div class="flex items-center gap-2 pt-2 sm:pt-0 border-t sm:border-t-0 border-zinc-800/50 justify-between sm:justify-end">
              <div class="flex items-center gap-1.5">
                <i data-lucide="calendar" class="w-3.5 h-3.5 text-zinc-500"></i>
                <input type="date" value="${dueDate}" onchange="updateTaskField('${task.id}', 'due_date', this.value || null)"
                  class="bg-zinc-950 border border-zinc-800 text-zinc-400 text-xs rounded-lg px-2 py-1 outline-none focus:border-zinc-600 transition-colors cursor-pointer" />
              </div>

              <button onclick="deleteTask('${task.id}')" title="Supprimer la tâche" class="text-zinc-600 hover:text-red-400 p-1 transition-colors">
                <i data-lucide="trash-2" class="w-4 h-4"></i>
              </button>
            </div>
          </div>
        `;
      }).join('');
      lucide.createIcons();
    }

    async function createTask(e) {
      e.preventDefault();
      const input = document.getElementById('new-task-title');
      const title = input.value.trim();
      if (!title) return;

      const { data, error } = await supabaseClient.from('tasks').insert([{ title, status: 'inbox' }]).select();
      if (data) {
        tasks.unshift(data[0]);
        input.value = '';
        renderTasks();
        notify('Tâche ajoutée');
      }
    }

    async function updateTaskField(id, field, value) {
      await supabaseClient.from('tasks').update({ [field]: value }).eq('id', id);
      const t = tasks.find(item => item.id === id);
      if (t) t[field] = value;
      notify();
    }

    async function toggleTask(id, currentStatus) {
      const nextStatus = currentStatus === 'done' ? 'inbox' : 'done';
      await updateTaskField(id, 'status', nextStatus);
      renderTasks();
    }

    async function deleteTask(id) {
      if (!confirm('Supprimer cette tâche ?')) return;
      await supabaseClient.from('tasks').delete().eq('id', id);
      tasks = tasks.filter(t => t.id !== id);
      renderTasks();
      notify('Tâche supprimée');
    }

    // ==========================================
    // IDÉES
    // ==========================================
    function renderIdeas() {
      const list = document.getElementById('ideas-list');
      document.getElementById('ideas-count').innerText = ideas.length;

      if (ideas.length === 0) {
        list.innerHTML = `<div class="col-span-2 text-center py-16 text-zinc-500 border border-dashed border-zinc-800 rounded-2xl text-sm">Aucune idée capturée.</div>`;
        return;
      }

      list.innerHTML = ideas.map(idea => {
        const dateStr = new Date(idea.created_at).toLocaleDateString('fr-FR');
        const tagsHtml = (idea.tags && Array.isArray(idea.tags)) 
          ? idea.tags.map(t => `<span class="bg-zinc-800 text-zinc-300 text-[10px] px-2 py-0.5 rounded">#${t}</span>`).join(' ') 
          : '';

        return `
          <div class="bg-zinc-900/40 border border-zinc-800/80 hover:border-zinc-700 rounded-2xl p-5 flex flex-col justify-between transition-all space-y-3">
            <div>
              <div class="flex items-center justify-between mb-3">
                <span class="flex items-center gap-1.5 text-xs font-semibold px-2.5 py-1 rounded-full bg-amber-500/10 text-amber-400 border border-amber-500/20">
                  <i data-lucide="sparkles" class="w-3 h-3"></i>
                  Idée
                </span>

                <div class="flex items-center gap-2">
                  <select onchange="updateIdeaField('${idea.id}', 'status', this.value)" class="bg-zinc-950 border border-zinc-800 text-zinc-400 text-xs rounded-lg px-2 py-1 outline-none focus:border-zinc-600 cursor-pointer">
                    <option value="capturée" ${idea.status === 'capturée' ? 'selected' : ''}>Capturée</option>
                    <option value="à qualifier" ${idea.status === 'à qualifier' ? 'selected' : ''}>À qualifier</option>
                    <option value="en cours" ${idea.status === 'en cours' ? 'selected' : ''}>En cours</option>
                    <option value="validée" ${idea.status === 'validée' ? 'selected' : ''}>Validée</option>
                    <option value="abandonnée" ${idea.status === 'abandonnée' ? 'selected' : ''}>Abandonnée</option>
                  </select>

                  <button onclick="deleteIdea('${idea.id}')" title="Supprimer l'idée" class="text-zinc-600 hover:text-red-400 p-1 transition-colors">
                    <i data-lucide="trash-2" class="w-4 h-4"></i>
                  </button>
                </div>
              </div>

              <!-- Titre d'idée modifiable -->
              <input type="text" value="${escapeHtml(idea.title || '')}" 
                onchange="updateIdeaField('${idea.id}', 'title', this.value)"
                class="w-full bg-transparent font-semibold text-zinc-200 text-base mb-2 outline-none border-b border-transparent focus:border-zinc-600 transition-colors" />

              <!-- Résumé modifiable -->
              <textarea rows="3" onchange="updateIdeaField('${idea.id}', 'summary', this.value)"
                class="w-full bg-zinc-950/60 border border-zinc-800/60 rounded-xl p-2.5 text-xs text-zinc-400 leading-relaxed outline-none focus:border-zinc-600 transition-colors">${escapeHtml(idea.summary || '')}</textarea>
            </div>

            <div class="mt-2 pt-3 border-t border-zinc-800/60 flex items-center justify-between text-xs text-zinc-500">
              <span class="flex items-center gap-1">
                <i data-lucide="clock" class="w-3 h-3"></i>
                ${dateStr}
              </span>
              <div class="flex gap-1">${tagsHtml}</div>
            </div>
          </div>
        `;
      }).join('');
      lucide.createIcons();
    }

    async function createIdea(e) {
      e.preventDefault();
      const titleInput = document.getElementById('new-idea-title');
      const summaryInput = document.getElementById('new-idea-summary');
      const title = titleInput.value.trim();
      const summary = summaryInput.value.trim();
      if (!title) return;

      const { data } = await supabaseClient.from('ideas').insert([{ title, summary, status: 'capturée' }]).select();
      if (data) {
        ideas.unshift(data[0]);
        titleInput.value = '';
        summaryInput.value = '';
        renderIdeas();
        notify('Idée créée');
      }
    }

    async function updateIdeaField(id, field, value) {
      await supabaseClient.from('ideas').update({ [field]: value }).eq('id', id);
      const i = ideas.find(item => item.id === id);
      if (i) i[field] = value;
      notify();
    }

    async function deleteIdea(id) {
      if (!confirm('Supprimer cette idée ?')) return;
      await supabaseClient.from('ideas').delete().eq('id', id);
      ideas = ideas.filter(i => i.id !== id);
      renderIdeas();
      notify('Idée supprimée');
    }

    // ==========================================
    // INBOX
    // ==========================================
    function renderInbox() {
      const list = document.getElementById('inbox-list');
      document.getElementById('inbox-count').innerText = inboxItems.length;

      if (inboxItems.length === 0) {
        list.innerHTML = `<div class="text-center py-16 text-zinc-500 border border-dashed border-zinc-800 rounded-2xl text-sm">Inbox vide.</div>`;
        return;
      }

      list.innerHTML = inboxItems.map(item => {
        const dateStr = new Date(item.created_at).toLocaleString('fr-FR', {
          day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit'
        });

        let badgeColor = 'bg-zinc-800 text-zinc-300 border-zinc-700';
        if (item.entity_type === 'task') badgeColor = 'bg-emerald-500/10 text-emerald-400 border-emerald-500/20';
        if (item.entity_type === 'idea') badgeColor = 'bg-amber-500/10 text-amber-400 border-amber-500/20';
        if (item.entity_type === 'conversation') badgeColor = 'bg-purple-500/10 text-purple-400 border-purple-500/20';

        return `
          <div class="bg-zinc-900/40 border border-zinc-800/80 hover:border-zinc-700 rounded-2xl p-5 space-y-3 transition-all">
            <div class="flex flex-wrap items-center justify-between gap-2">
              <div class="flex items-center gap-2">
                <select onchange="updateInboxField('${item.id}', 'entity_type', this.value)" class="border text-xs rounded-lg px-2 py-1 outline-none cursor-pointer ${badgeColor}">
                  <option value="task" ${item.entity_type === 'task' ? 'selected' : ''}>Task</option>
                  <option value="idea" ${item.entity_type === 'idea' ? 'selected' : ''}>Idea</option>
                  <option value="note" ${item.entity_type === 'note' ? 'selected' : ''}>Note</option>
                  <option value="conversation" ${item.entity_type === 'conversation' ? 'selected' : ''}>Conversation</option>
                  <option value="skill" ${item.entity_type === 'skill' ? 'selected' : ''}>Skill</option>
                </select>

                <span class="text-xs text-zinc-500 flex items-center gap-1">
                  <i data-lucide="clock" class="w-3 h-3"></i>
                  ${dateStr}
                </span>
              </div>

              <div class="flex items-center gap-2">
                <select onchange="updateInboxField('${item.id}', 'status', this.value)" class="bg-zinc-950 border border-zinc-800 text-zinc-400 text-xs rounded-lg px-2 py-1 outline-none focus:border-zinc-600 cursor-pointer">
                  <option value="processed" ${item.status === 'processed' ? 'selected' : ''}>Traité</option>
                  <option value="pending" ${item.status === 'pending' ? 'selected' : ''}>En attente</option>
                  <option value="archived" ${item.status === 'archived' ? 'selected' : ''}>Archivé</option>
                </select>

                <button onclick="deleteInboxItem('${item.id}')" title="Supprimer" class="text-zinc-600 hover:text-red-400 p-1 transition-colors">
                  <i data-lucide="trash-2" class="w-4 h-4"></i>
                </button>
              </div>
            </div>

            <div>
              <label class="block text-[10px] uppercase font-semibold text-zinc-500 mb-1">Note brute (modifiable en direct)</label>
              <textarea onchange="updateInboxField('${item.id}', 'raw_note', this.value)" rows="2" class="w-full bg-zinc-950 border border-zinc-800/80 rounded-xl p-3 text-sm text-zinc-200 outline-none focus:border-zinc-600 transition-colors leading-relaxed">${escapeHtml(item.raw_note || '')}</textarea>
            </div>

            ${item.reason ? `
              <div class="text-xs text-zinc-400 bg-zinc-950/40 p-2.5 rounded-lg border border-zinc-800/50 flex items-start gap-2">
                <span class="text-zinc-500">🤖</span>
                <span><span class="text-zinc-500 font-medium">Raisonnement IA :</span> ${escapeHtml(item.reason)}</span>
              </div>
            ` : ''}
          </div>
        `;
      }).join('');
      lucide.createIcons();
    }

    async function updateInboxField(id, field, value) {
      await supabaseClient.from('inbox').update({ [field]: value }).eq('id', id);
      const item = inboxItems.find(i => i.id === id);
      if (item) item[field] = value;
      notify();
      if (field === 'entity_type') renderInbox();
    }

    async function deleteInboxItem(id) {
      if (!confirm('Supprimer cette capture de l’inbox ?')) return;
      await supabaseClient.from('inbox').delete().eq('id', id);
      inboxItems = inboxItems.filter(i => i.id !== id);
      renderInbox();
      notify('Inbox mise à jour');
    }

    // Protection anti-injection
    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
    }

    // Chargement initial
    window.addEventListener('DOMContentLoaded', () => {
      switchTab('tasks');
      loadData();
    });
  </script>
</body>
</html>
